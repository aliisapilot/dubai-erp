<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#grid)" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Blueprint Background -->
  <rect width="1000%" height="1000%" fill="#0a1220"/>
  <rect width="1600" height="1000" fill="url(#majorGrid)" />

  <!-- Outer Border & Margins -->
  <rect x="30" y="30" width="1540" height="940" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <rect x="36" y="36" width="1528" height="928" fill="none" stroke="#0284c7" stroke-width="0.8" opacity="0.5"/>

  <!-- Title Block Header -->
  <g transform="translate(1080, 830)">
    <rect x="0" y="0" width="480" height="130" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="0" y1="40" x2="480" y2="40" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="85" x2="480" y2="85" stroke="#38bdf8" stroke-width="1"/>
    <line x1="240" y1="40" x2="240" y2="130" stroke="#38bdf8" stroke-width="1"/>
    <text x="240" y="26" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1.5">DUBAI TENSION STRUCTURES &amp; SHADE CO.</text>
    <text x="15" y="62" fill="#94a3b8" font-family="monospace" font-size="11">PROJECT: AL QUOZ CAR PARK</text>
    <text x="15" y="77" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">6-BAY CANTILEVER PARKING SHADES</text>
    <text x="255" y="62" fill="#94a3b8" font-family="monospace" font-size="11">DRAWING NO: DWG-TS-2026-04</text>
    <text x="255" y="77" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">SCALE: 1:100 (1mm = 0.08px)</text>
    <text x="15" y="108" fill="#94a3b8" font-family="monospace" font-size="10">STATUS: APPROVED FOR FABRICATION</text>
    <text x="15" y="122" fill="#38bdf8" font-family="monospace" font-size="10">SPEC: PVC 900 GSM FERRARI 702</text>
    <text x="255" y="108" fill="#94a3b8" font-family="monospace" font-size="10">DATE: 06-OCT-2026</text>
    <text x="255" y="122" fill="#94a3b8" font-family="monospace" font-size="10">REVISION: REV-03 (FINAL)</text>
  </g>

  <!-- Drawing Title -->
  <text x="80" y="80" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold" letter-spacing="1">CANOPY GENERAL ARRANGEMENT &amp; TAKEOFF PLAN</text>
  <text x="80" y="105" fill="#64748b" font-family="monospace" font-size="12">ARCHITECTURAL SCHEMATIC • UNITS IN MILLIMETRES (mm)</text>

  <!-- Calibration Guide Ruler Bar at Top Right -->
  <g transform="translate(100, 140)">
    <rect x="-10" y="-10" width="460" height="60" fill="#0369a1" fill-opacity="0.15" stroke="#0284c7" stroke-width="1" rx="4"/>
    <text x="10" y="12" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">REFERENCE CALIBRATION BAR (CLICK START &amp; END WITH CALIBRATE TOOL):</text>
    <!-- Bar line from 0 to 400px = exactly 5000 mm -->
    <line x1="20" y1="32" x2="420" y2="32" stroke="#f59e0b" stroke-width="3"/>
    <line x1="20" y1="22" x2="20" y2="42" stroke="#f59e0b" stroke-width="3"/>
    <line x1="420" y1="22" x2="420" y2="42" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="20" cy="32" r="5" fill="#f59e0b"/>
    <circle cx="420" cy="32" r="5" fill="#f59e0b"/>
    <text x="220" y="27" fill="#fef08a" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">5,000 mm (400 px reference = 0.08 px/mm)</text>
  </g>

  <!-- BAY 1: Cantilever PVC Shade (12,000mm x 5,360mm) -> at 0.08px/mm = 960px x 428.8px -->
  <g transform="translate(100, 240)">
    <!-- Shading canopy fill -->
    <rect x="0" y="0" width="960" height="429" fill="#0284c7" fill-opacity="0.08" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8,4" rx="6"/>
    
    <!-- Outer perimeter steel frame -->
    <rect x="15" y="15" width="930" height="399" fill="#0f172a" fill-opacity="0.4" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Centre Welding Joint (Longitudinal) -->
    <line x1="15" y1="214.5" x2="945" y2="214.5" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="480" y="205" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">CENTRE HIGH-FREQUENCY WELD SEAM (12,000 mm)</text>

    <!-- Support columns / cantilever arms -->
    <circle cx="35" cy="40" r="14" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="40" r="4" fill="#38bdf8"/>
    <text x="60" y="45" fill="#94a3b8" font-family="monospace" font-size="10">COL C1</text>

    <circle cx="35" cy="389" r="14" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="389" r="4" fill="#38bdf8"/>
    <text x="60" y="394" fill="#94a3b8" font-family="monospace" font-size="10">COL C2</text>

    <!-- Structural cantilever beams extending across -->
    <line x1="35" y1="40" x2="945" y2="40" stroke="#475569" stroke-width="2"/>
    <line x1="35" y1="389" x2="945" y2="389" stroke="#475569" stroke-width="2"/>

    <!-- Internal cross trusses -->
    <line x1="320" y1="15" x2="320" y2="414" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="640" y1="15" x2="640" y2="414" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Bay Label -->
    <rect x="400" y="90" width="160" height="35" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="4"/>
    <text x="480" y="112" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">AREA 1: CANOPY BAY 1</text>
    <text x="480" y="145" fill="#93c5fd" font-family="monospace" font-size="11" text-anchor="middle">PVC 900 GSM • 64.32 m²</text>

    <!-- Dimension Label (Length: 12,000 mm) -->
    <g transform="translate(0, 445)">
      <line x1="0" y1="10" x2="960" y2="10" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="0" y1="2" x2="0" y2="18" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="960" y1="2" x2="960" y2="18" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="420" y="0" width="120" height="20" fill="#0a1220"/>
      <text x="480" y="15" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">12,000 mm</text>
    </g>

    <!-- Dimension Label (Width: 5,360 mm) -->
    <g transform="translate(975, 0)">
      <line x1="10" y1="0" x2="10" y2="429" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="2" y1="0" x2="18" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="2" y1="429" x2="18" y2="429" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="0" y="204" width="75" height="20" fill="#0a1220"/>
      <text x="36" y="218" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">5,360 mm</text>
    </g>
  </g>

  <!-- Technical Notes in lower left -->
  <g transform="translate(100, 750)">
    <rect x="0" y="0" width="850" height="180" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="6"/>
    <text x="20" y="28" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">FABRICATION &amp; TAKEOFF NOTES:</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="11">1. FABRIC MEMBRANE: Ferrari Précontraint 702 PVC Fluotop T2, flame retardant class B1.</text>
    <text x="20" y="78" fill="#94a3b8" font-family="monospace" font-size="11">2. PERIMETER EDGES: Continuous high-frequency heat-welded pocket with Ø8mm galvanized steel wire rope.</text>
    <text x="20" y="101" fill="#94a3b8" font-family="monospace" font-size="11">3. CENTRE JOINT: 50mm longitudinal lap weld engineered for tensile load transfer across cantilever span.</text>
    <text x="20" y="124" fill="#94a3b8" font-family="monospace" font-size="11">4. HARDWARE: Grade 316 stainless steel corner plates, turnbuckles, D-shackles and M16 anchor bolts.</text>
    <text x="20" y="147" fill="#34d399" font-family="monospace" font-size="11">5. CALIBRATION: Use standard 5,000 mm top reference marker to calibrate canvas scale before digital takeoff.</text>
  </g>
</svg>
