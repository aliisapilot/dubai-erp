<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="brandGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="brandNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <!-- Architectural / Engineering Monogram Icon -->
  <g transform="translate(10, 10)">
    <!-- Skyscraper / Structure Tower 1 -->
    <polygon points="20,95 20,40 38,20 38,95" fill="url(#brandNavy)" />
    <!-- Tower 2 (Main Apex) -->
    <polygon points="42,95 42,10 62,0 62,95" fill="url(#brandGold)" />
    <!-- Tower 3 -->
    <polygon points="66,95 66,30 84,45 84,95" fill="url(#brandNavy)" />
    <!-- Architectural Grid Lines -->
    <line x1="20" y1="95" x2="84" y2="95" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="45" x2="38" y2="45" stroke="#F3E5AB" stroke-width="1.5" />
    <line x1="28" y1="60" x2="38" y2="60" stroke="#F3E5AB" stroke-width="1.5" />
    <line x1="28" y1="75" x2="38" y2="75" stroke="#F3E5AB" stroke-width="1.5" />
    <line x1="48" y1="25" x2="56" y2="25" stroke="#0F172A" stroke-width="1.5" />
    <line x1="48" y1="45" x2="56" y2="45" stroke="#0F172A" stroke-width="1.5" />
    <line x1="48" y1="65" x2="56" y2="65" stroke="#0F172A" stroke-width="1.5" />
    <line x1="72" y1="55" x2="80" y2="55" stroke="#F3E5AB" stroke-width="1.5" />
    <line x1="72" y1="75" x2="80" y2="75" stroke="#F3E5AB" stroke-width="1.5" />
  </g>
  <!-- Company Name & Branding -->
  <g transform="translate(115, 25)">
    <text x="0" y="24" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" letter-spacing="2" fill="#0F172A">
      DUBAI ERP
    </text>
    <text x="0" y="44" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#B45309">
      ENGINEERING &amp; CONTRACTING
    </text>
    <text x="0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="500" letter-spacing="1" fill="#64748B">
      DUBAI • UNITED ARAB EMIRATES
    </text>
    <line x1="0" y1="70" x2="270" y2="70" stroke="#CBD5E1" stroke-width="1" />
  </g>
</svg>
